# Keep `main` an exact mirror of upstream omnigent-ai/omnigent (fast-forward only).
# Our pinned, patched base lives on `cognizioware-base`; moving that pin to a newer
# upstream commit is a reviewed PR, never automatic.
name: Sync upstream main
on:
  schedule:
    - cron: '17 9 * * *'   # daily 09:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main \
            --jq '"merge_type=\(.merge_type) base=\(.base_branch) message=\(.message)"'
      - name: Report how far cognizioware-base is behind upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/compare/cognizioware-base...main" \
            --jq '"cognizioware-base is behind main by \(.ahead_by) commits"' >> "$GITHUB_STEP_SUMMARY"
